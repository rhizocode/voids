services:
  voids:
    # Build from this repo. To use a published image instead, comment out
    # `build` and set `image: ghcr.io/rhizocode/voids:latest`.
    build:
      context: .
      args:
        # Version shown in-app and at /api/version. Export APP_VERSION before
        # `docker compose build` (scripts/release.sh does this from the git tag);
        # otherwise the Dockerfile default ("0.0.0-untagged") is used.
        APP_VERSION: ${APP_VERSION:-}
    image: voids:local
    container_name: voids
    ports:
      - '8484:8484'
    volumes:
      - ./data:/data
    environment:
      PORT: '8484'
      DATA_DIR: /data
      # --- Run-as user/group ---
      # The entrypoint chowns /data to PUID:PGID and drops privileges to match,
      # so a bind-mounted ./data stays writable. Defaults to 1000:1000. On a NAS
      # (e.g. unRAID) set these to the owner of the host directory — unRAID: 99/100.
      # PUID: '1000'
      # PGID: '1000'
      # Sub-path mount when served behind a reverse proxy (default "/").
      BASE_URL: /
      # --- Authentication (default: open, for trusted LANs) ---
      # AUTH_MODE: basic
      # AUTH_USERNAME: admin
      # AUTH_PASSWORD: change-me
      # --- TLS (default: off — terminate at a reverse proxy instead) ---
      # Set "on" to serve HTTPS with a self-signed cert generated into /data/tls.
      # TLS: 'off'
      # --- TMDB token-bucket sustained rate (req/s) ---
      # TMDB_RATE_LIMIT: '40'
      # LOG_LEVEL: log
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8484/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
